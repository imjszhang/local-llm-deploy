<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLM 监控</title>
    <link rel="stylesheet" href="/monitor.css">
</head>
<body>
    <div class="header">
        <h1>LLM 监控</h1>
        <div class="header-right">
            <a class="header-link" href="/knowledge/">知识库</a>
            <span><span class="conn-dot" id="connDot"></span> <span id="connText">连接中</span></span>
            <span id="lastUpdate">-</span>
        </div>
    </div>

    <form id="apiAuthForm" class="api-auth" autocomplete="off">
        <label for="apiKeyInput">模型 API Key</label>
        <input id="apiKeyInput" type="password" placeholder="仅在本页内使用" autocomplete="off">
        <button type="submit">应用</button>
        <button id="clearApiKey" type="button">清除</button>
        <span id="authStatus" class="muted-text">状态摘要可直接查看；模型详情需要服务的 API Key。</span>
    </form>

    <!-- System resources -->
    <div class="sys-row" id="sysRow">
        <div class="sys-item">
            <div class="label">CPU</div>
            <div class="ring-wrap">
                <svg viewBox="0 0 72 72" width="72" height="72">
                    <circle class="ring-track" cx="36" cy="36" r="30"/>
                    <circle class="ring-fill" id="cpuRing" cx="36" cy="36" r="30" stroke="var(--accent)"/>
                </svg>
                <div class="ring-label" id="cpuLabel">-</div>
            </div>
            <div class="sparkline-wrap"><canvas id="cpuSpark"></canvas></div>
        </div>
        <div class="sys-item">
            <div class="label">内存</div>
            <div class="ring-wrap">
                <svg viewBox="0 0 72 72" width="72" height="72">
                    <circle class="ring-track" cx="36" cy="36" r="30"/>
                    <circle class="ring-fill" id="memRing" cx="36" cy="36" r="30" stroke="var(--info)"/>
                </svg>
                <div class="ring-label" id="memLabel">-</div>
            </div>
            <div class="sparkline-wrap"><canvas id="memSpark"></canvas></div>
        </div>
        <div class="sys-item">
            <div class="label">Load Average</div>
            <div style="font-family:ui-monospace,monospace;font-size:1.1rem;font-weight:600;margin:0.75rem 0 0.25rem" id="loadAvg">-</div>
            <div class="muted-text" id="loadDetail">1m / 5m / 15m</div>
        </div>
    </div>

    <!-- Unified memory bar -->
    <div class="card" id="memBarCard">
        <div class="card-title">统一内存分布 <span class="badge" id="memTotalBadge">-</span></div>
        <div class="mem-bar-wrap">
            <div class="mem-bar" id="memBar"></div>
        </div>
        <div class="mem-legend" id="memLegend"></div>
    </div>

    <!-- 推理后端（llama-server / 外部 OpenAI 兼容服务等） -->
    <div id="llamaSection">
        <div class="card-title" style="padding:0 0 0.5rem">
            推理后端
            <span class="badge" id="llamaCount">0 个模型</span>
            <span class="badge" id="globalGate">-</span>
        </div>
        <p id="backendUncertain" class="error-text" role="status" hidden></p>
        <div class="model-grid" id="llamaGrid">
            <div class="muted-text loading">加载中...</div>
        </div>
    </div>

    <!-- Ollama section -->
    <div class="section-gap" id="ollamaSection">
        <div class="card-title" style="padding:0 0 0.5rem">
            Ollama
            <span class="badge" id="ollamaStatus">-</span>
            <span class="badge info" id="ollamaVersion">-</span>
        </div>
        <div class="card" id="ollamaCard">
            <div class="muted-text loading">加载中...</div>
        </div>
    </div>

    <script src="/monitor.js" defer></script>
</body>
</html>
